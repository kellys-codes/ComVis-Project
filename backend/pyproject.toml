[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for dermoscopic lesion classification with CV features and ONNX inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.1",
    "numpy>=1.26.0",
    "onnxruntime>=1.24.1",
    "opencv-python-headless>=4.8.1.78",
    "pillow>=12.2.0",
    "python-multipart>=0.0.7",
    "scikit-image>=0.21.0",
    "uvicorn[standard]>=0.23.2",
]
